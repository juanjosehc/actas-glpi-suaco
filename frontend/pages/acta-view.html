<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actas GLPI - Vista de Acta</title>
    <link rel="stylesheet" href="../css/system.css">
    <link rel="stylesheet" href="../css/acta-document.css">
    <link rel="stylesheet" href="../css/acta-view.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo"><img src="../img/LogoC.png" alt="Logo"></div>
            <span class="sidebar-title">ACTAS GLPI</span>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <span class="sidebar-version">v1.0.0</span>
        </div>
    </aside>

    <div class="main-area">

        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="topbar-left">
                <div class="topbar-logo"><img src="../img/LogoC.png" alt="Logo"></div>
                <span class="topbar-system">Actas GLPI</span>
            </div>
            <div class="topbar-right">
                <div class="user-badge">
                    <div class="user-avatar" id="userAvatar"></div>
                    <div class="user-info">
                        <span class="user-name" id="userName"></span>
                        <span class="user-role" id="userRole"></span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Cerrar sesion">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Salir</span>
                </button>
            </div>
        </header>

        <main class="content">

            <div class="page-header">
                <h1 class="page-title" id="viewTitle">Acta</h1>
                <p class="page-subtitle" id="viewSubtitle">Vista del documento corporativo.</p>
            </div>

            <div class="view-toolbar">
                <div class="view-toolbar-spacer"></div>
                <a class="btn-download-pdf" id="downloadPdfBtn" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Descargar PDF
                </a>
                <button class="btn-download-pdf btn-send-firma" id="sendFirmaBtn" style="display:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
                    Enviar a Firma
                </button>
            </div>

            <div class="view-info-bar" id="viewInfoBar">
                <div class="view-info-item">
                    <span class="view-info-label">Estado</span>
                    <span class="view-info-value" id="viewEstado">-</span>
                </div>
                <div class="view-info-item">
                    <span class="view-info-label">Tipo</span>
                    <span class="view-info-value" id="viewTipo">-</span>
                </div>
                <div class="view-info-item">
                    <span class="view-info-label">Usuario</span>
                    <span class="view-info-value" id="viewUsuario">-</span>
                </div>
                <div class="view-info-item">
                    <span class="view-info-label">Equipo</span>
                    <span class="view-info-value" id="viewEquipo">-</span>
                </div>
                <div class="view-info-item">
                    <span class="view-info-label">Fecha</span>
                    <span class="view-info-value" id="viewFecha">-</span>
                </div>
            </div>

            <div class="view-evidences" id="viewEvidences" style="display:none">
                <h3 class="evidences-title">Evidencias</h3>
                <div class="evidences-grid" id="evidencesGrid"></div>
            </div>

            <div class="view-docs" id="viewDocs" style="display:none;">
                <h3 class="docs-title">Documentos Asociados</h3>
                <div class="docs-list">
                    <button type="button" class="doc-card doc-card--active" id="docActaCard" data-doc="acta">
                        <span class="doc-card-icon">📄</span>
                        <span class="doc-card-body">
                            <span class="doc-card-name">Acta de Entrega</span>
                            <span class="doc-card-desc">Documento oficial del acta</span>
                        </span>
                    </button>
                    <button type="button" class="doc-card" id="docChecklistCard" data-doc="checklist" style="display:none;">
                        <span class="doc-card-icon">📋</span>
                        <span class="doc-card-body">
                            <span class="doc-card-name">Checklist de Entrega</span>
                            <span class="doc-card-desc">Checklist asociado al proceso de entrega</span>
                        </span>
                    </button>
                </div>
            </div>

            <div class="view-document" id="viewDocument" style="display:none;">
                <iframe id="pdfViewer"
                    style="width:100%;height:800px;border:none;"
                    src="">
                </iframe>
            </div>
            <div class="view-loading" id="viewLoading">
                <p style="color:#64748B;padding:40px;text-align:center;">Cargando documento...</p>
            </div>
            <div class="view-no-pdf" id="viewNoPdf" style="display:none;">
                <p style="color:#DC2626;padding:40px;text-align:center;">No hay PDF disponible para esta acta.</p>
            </div>

        </main>

    </div>

</div>

<div class="modal-overlay" id="enviarModal">
    <div class="modal-container modal-sm">
        <div class="modal-header">
            <h2 class="modal-title">Enviar a Firma</h2>
            <button class="modal-close" id="enviarClose" aria-label="Cerrar">&times;</button>
        </div>
        <div class="modal-body">
            <p class="modal-desc">Confirme el correo al que se enviara el enlace de firma:</p>
            <input class="form-input" type="email" id="enviarCorreo" placeholder="correo@empresa.com" autocomplete="off">
            <div class="form-error" id="enviarError"></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="enviarCancel">Cancelar</button>
            <button class="btn btn-primary" id="enviarConfirm">Enviar</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/acta-view.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        AdminLayout.init({ currentFile: "acta-view.html" });
    });
</script>
</body>
</html>
