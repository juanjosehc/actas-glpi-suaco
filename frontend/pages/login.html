<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actas GLPI - Iniciar Sesion</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<main class="login-page">
    <div class="login-card">

        <header class="login-header">
            <div class="login-logo">
                <img src="../img/LogoC.png" alt="Logo Coltefinanciera">
            </div>
            <h1 class="login-title">ACTAS GLPI</h1>
            <p class="login-subtitle">Inicie sesion para continuar</p>
        </header>

        <form class="login-form" id="loginForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <input
                    class="form-input"
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingrese su usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contrasena</label>
                <input
                    class="form-input"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contrasena"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="login-error" id="loginError" role="alert" aria-live="assertive">
                <svg class="login-error-icon" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span id="loginErrorText"></span>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Ingresar</span>
                <span class="btn-loading">
                    <span class="spinner"></span>
                    Iniciando sesion...
                </span>
            </button>
        </form>

    </div>
</main>

<script src="../js/login.js"></script>
<script src="../js/login-ui.js"></script>

</body>
</html>
