<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actas GLPI - Inicio</title>
    <link rel="stylesheet" href="../css/system.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">
                <img src="../img/LogoC.png" alt="Logo">
            </div>
            <span class="sidebar-title">ACTAS GLPI</span>
        </div>

        <nav class="sidebar-nav" id="sidebarNav" aria-label="Navegacion principal">
        </nav>

        <div class="sidebar-footer">
            <span class="sidebar-version">v1.0.0</span>
        </div>
    </aside>

    <div class="main-area">

        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>

            <div class="topbar-left">
                <div class="topbar-logo">
                    <img src="../img/LogoC.png" alt="Logo">
                </div>
                <span class="topbar-system">Actas GLPI</span>
            </div>

            <div class="topbar-right">
                <div class="user-badge" id="userBadge">
                    <div class="user-avatar" id="userAvatar"></div>
                    <div class="user-info">
                        <span class="user-name" id="userName"></span>
                        <span class="user-role" id="userRole"></span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Cerrar sesion">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Salir</span>
                </button>
            </div>
        </header>

        <main class="content" id="mainContent">
            <div class="welcome-section">
                <h1 class="welcome-title" id="welcomeTitle">Bienvenido</h1>
                <p class="welcome-text" id="welcomeText">Seleccione una opcion del menu lateral para comenzar.</p>
            </div>
        </main>

    </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/home.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        AdminLayout.init({ currentFile: "home.html" });
    });
</script>
</body>
</html>
