<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actas GLPI - Gestion de Usuarios</title>
    <link rel="stylesheet" href="../css/system.css">
    <link rel="stylesheet" href="../css/usuarios.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">
                <img src="../img/LogoC.png" alt="Logo">
            </div>
            <span class="sidebar-title">ACTAS GLPI</span>
        </div>
        <nav class="sidebar-nav" id="sidebarNav" aria-label="Navegacion principal"></nav>
        <div class="sidebar-footer">
            <span class="sidebar-version">v1.0.0</span>
        </div>
    </aside>

    <div class="main-area">

        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="topbar-left">
                <div class="topbar-logo"><img src="../img/LogoC.png" alt="Logo"></div>
                <span class="topbar-system">Actas GLPI</span>
            </div>
            <div class="topbar-right">
                <div class="user-badge">
                    <div class="user-avatar" id="userAvatar"></div>
                    <div class="user-info">
                        <span class="user-name" id="userName"></span>
                        <span class="user-role" id="userRole"></span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Cerrar sesion">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Salir</span>
                </button>
            </div>
        </header>

        <main class="content">

            <div class="page-header">
                <h1 class="page-title">Gestion de Usuarios</h1>
                <p class="page-subtitle">Administre los usuarios del sistema.</p>
            </div>

            <div class="toolbar">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input class="search-input" type="text" id="searchInput" placeholder="Buscar por cedula, nombre, username, correo o cargo...">
                    <button class="search-clear" id="searchClear" aria-label="Limpiar busqueda">&times;</button>
                </div>
                <button class="btn btn-primary" id="btnNuevo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nuevo Usuario
                </button>
            </div>

            <div class="table-container">
                <table class="usuarios-table" id="usuariosTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cedula</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Username</th>
                            <th>Correo</th>
                            <th>Cargo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usuariosBody"></tbody>
                </table>
                <div class="empty-state" id="emptyState">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                    <p class="empty-text">No se encontraron usuarios.</p>
                </div>
            </div>

            <div class="pagination-bar" id="paginationBar">
                <span class="pagination-info" id="paginationInfo"></span>
                <div class="pagination-controls">
                    <button class="btn btn-secondary btn-sm" id="btnPrev">Anterior</button>
                    <span class="pagination-current" id="paginationCurrent">1</span>
                    <button class="btn btn-secondary btn-sm" id="btnNext">Siguiente</button>
                </div>
            </div>

            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
                <span class="loading-text">Cargando usuarios...</span>
            </div>

        </main>

    </div>

</div>

<div class="modal-overlay" id="modalUser">
    <div class="modal-container">
        <div class="modal-header">
            <h2 class="modal-title" id="modalUserTitle">Nuevo Usuario</h2>
            <button class="modal-close" id="modalUserClose" aria-label="Cerrar">&times;</button>
        </div>
        <div class="modal-body" id="modalUserBody">
            <form id="userForm" novalidate>
                <input type="hidden" id="formUserId">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="formCedula">Cedula</label>
                        <input class="form-input" type="text" id="formCedula" maxlength="20" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="formNombres">Nombres</label>
                        <input class="form-input" type="text" id="formNombres" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="formApellidos">Apellidos</label>
                        <input class="form-input" type="text" id="formApellidos" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="formUsername">Username</label>
                        <input class="form-input" type="text" id="formUsername" maxlength="50" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="formCorreo">Correo</label>
                        <input class="form-input" type="email" id="formCorreo" maxlength="100" required>
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label class="form-label" for="formPassword">Password</label>
                        <input class="form-input" type="password" id="formPassword" minlength="6" maxlength="128">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="formCargo">Cargo</label>
                        <input class="form-input" type="text" id="formCargo" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="formEmpresa">Empresa</label>
                        <input class="form-input" type="text" id="formEmpresa" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="formLugarTrabajo">Lugar de Trabajo</label>
                        <input class="form-input" type="text" id="formLugarTrabajo" maxlength="150">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="formRol">Rol</label>
                        <select class="form-select" id="formRol" required>
                            <option value="">Seleccione...</option>
                            <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                            <option value="TECNICO">TECNICO</option>
                            <option value="AUDITOR">AUDITOR</option>
                        </select>
                    </div>
                </div>
                <div class="form-error" id="formError"></div>
            </form>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="modalUserCancel">Cancelar</button>
            <button class="btn btn-primary" id="modalUserSave">Guardar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalView">
    <div class="modal-container">
        <div class="modal-header">
            <h2 class="modal-title">Detalle del Usuario</h2>
            <button class="modal-close" id="modalViewClose" aria-label="Cerrar">&times;</button>
        </div>
        <div class="modal-body" id="modalViewBody"></div>
    </div>
</div>

<div class="modal-overlay" id="modalConfirm">
    <div class="modal-container modal-sm">
        <div class="modal-header">
            <h2 class="modal-title" id="modalConfirmTitle">Confirmar</h2>
            <button class="modal-close" id="modalConfirmClose" aria-label="Cerrar">&times;</button>
        </div>
        <div class="modal-body">
            <p class="modal-desc" id="modalConfirmText"></p>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="modalConfirmCancel">Cancelar</button>
            <button class="btn btn-danger" id="modalConfirmOk">Confirmar</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/login.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/usuarios.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        AdminLayout.init({ currentFile: "usuarios.html" });
    });
</script>
</body>
</html>
