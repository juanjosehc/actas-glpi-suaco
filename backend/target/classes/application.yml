# =====================================================
# CONFIGURACION DE LA APLICACION
# =====================================================
#
# SEC-002: EN ESTE ARCHIVO NO EXISTEN SECRETOS. Credenciales (password DB,
# JWT secret, tokens GLPI) se inyectan por variables de entorno o por
# backend/.env (gitignoreado). Copia backend/.env.example a backend/.env y
# completa los valores: es la configuración local de desarrollo.
#
#   DB_PASSWORD        Password de PostgreSQL
#   JWT_SECRET         Clave Base64 (minimo 256 bits / 44 caracteres)
#   GLPI_APP_TOKEN     App-Token de GLPI  (opcional sin GLPI)
#   GLPI_USER_TOKEN    User-Token de GLPI (opcional sin GLPI)
#
# Seguridad por defecto:
#   - DB_PASSWORD y JWT_SECRET SIN default: si faltan, la aplicacion NO
#     arranca (fail-fast). No existe secret "de respaldo" hardcodeado.
#   - GLPI tokens con default vacio: la app arranca y las llamadas GLPI
#     fallarian con 401 de GLPI, igual patrón que el SMTP opcional.

server:
  port: 8001

spring:
  # Carga opcional de backend/.env (gitignoreado) como properties: credenciales y
  # config por entorno sin commitearlas en el yaml. Se sobre-escribe por env vars reales.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/SaucoDB
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# JWT
security:
  jwt:
    # SEC-002: sin default. Si JWT_SECRET no esta definido la aplicacion no arranca.
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

  # =====================================================
  # RATE LIMITING (SEC-004) — RateLimitFilter
  # =====================================================
  # Limite de intentos por IP sobre /auth/login y /auth/register. Ventana fija
  # en memoria del proceso: ajustada para una LAN corporativa, no bloquea al
  # usuario legitimo pero frena fuerza bruta y spam de cuentas.
  #   login   : 20 intentos por IP cada 60s
  #   registro:  5 registros por IP por hora
  # trust-x-forwarded-for=false por defecto: activar SOLO detras de un proxy de
  # confianza. Si el servidor se expone directo, confiar en esa cabecera permite
  # evadir el limite falsificandola.
  rate-limit:
    login:
      max: ${RATE_LIMIT_LOGIN_MAX:20}
      segundos: ${RATE_LIMIT_LOGIN_SEGUNDOS:60}
    registro:
      max: ${RATE_LIMIT_REGISTRO_MAX:5}
      segundos: ${RATE_LIMIT_REGISTRO_SEGUNDOS:3600}
    trust-x-forwarded-for: ${RATE_LIMIT_TRUST_XFF:false}

# Integracion GLPI (URL no secreta; tokens por env, ver comentario arriba)
glpi:
  url: ${GLPI_URL:http://10.86.1.33/glpi/apirest.php}
  app-token: ${GLPI_APP_TOKEN:}
  user-token: ${GLPI_USER_TOKEN:}
  # Timeouts de la integracion (QA-12): limitan la espera de GLPI para que un
  # servidor caido o lento no cuelgue los requests del usuario. Sobre-escribibles
  # por variables de entorno (GLPI_CONNECT_TIMEOUT_MS / GLPI_REQUEST_TIMEOUT_MS).
  connect-timeout-ms: ${GLPI_CONNECT_TIMEOUT_MS:5000}
  request-timeout-ms: ${GLPI_REQUEST_TIMEOUT_MS:15000}

# =====================================================
# CORREO ELECTRONICO (SMTP)
# =====================================================
# Configuracion parametrizable. Si no se define, la
# aplicacion arranca y el envio se omite con un log.
# Compatible con Microsoft 365, Exchange y SMTP estandar.
# Use variables de entorno o edite estos valores.
mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:}
  properties:
    mail:
      smtp:
        auth: ${MAIL_SMTP_AUTH:true}
        starttls:
          enable: ${MAIL_SMTP_STARTTLS:true}
        connectiontimeout: ${MAIL_SMTP_TIMEOUT_CONNECT:10000}
        timeout: ${MAIL_SMTP_TIMEOUT:15000}
        writetimeout: ${MAIL_SMTP_TIMEOUT_WRITE:15000}
        ssl:
          # Evita javax.net.ssl.SSLHandshakeException (certificate_unknown) con relays
          # que rotan certificados (Brevo, SendGrid). Acepta el cert del host sin
          # exigir la cadena completa del cacerts del JDK. Sobre-escribible por env.
          trust: ${MAIL_SMTP_TRUST:smtp-relay.brevo.com}

# Almacenamiento persistente de archivos (PDF, DOCX, firmas, fotos).
# Ya no usa directorios temporales del SO.
# Configure STORAGE_ROOT (variable de entorno) o edite storage.root por entorno:
#   Windows:  D:/ActasStorage  o  C:/ActasStorage
#   Linux:    /data/actas  o  /opt/actas-storage
#   Docker:   STORAGE_ROOT=/data/actas  + volumen montado en /data/actas
# El default ${user.dir}/storage es para desarrollo local (ruta relativa al
# directorio de trabajo del proceso, no a Temp/AppData/Downloads).
storage:
  root: ${STORAGE_ROOT:${user.dir}/storage}

# Rutas de archivos (derivadas del storage root)
app:
  generated-dir: ${storage.root}/generated
  templates-dir: classpath:plantillas
  uploads-dir: ${storage.root}/uploads
  # URL base publica del portal de firma (sin slash final).
  # El enlace del correo sera: firma-url-base + "/firma.html?token={token}"
  # Ejemplos:
  #   Desarrollo:  http://localhost:5500
  #   Produccion:  https://actas.coltefinanciera.com
  firma-url-base: ${FIRMA_URL_BASE:}
  # Vigencia del enlace de recuperacion de contrasena en minutos (default 30).
  recuperacion-token-expira-minutos: ${RECUPERACION_TOKEN_EXPIRA_MINUTOS:30}
  # Vigencia del enlace de firma en horas (default 72h = 3 dias).
  firma-token-expira-horas: ${FIRMA_TOKEN_EXPIRA_HORAS:72}
  # Username del administrador principal protegido: no puede ser bloqueado ni
  # cambiarsele el rol. Si queda vacio, se protege el ADMINISTRADOR mas antiguo
  # (menor id_usuario).
  admin-protegido-username: ${ADMIN_PROTEGIDO_USERNAME:admin}
  # OTP del portal de firma (segunda capa de seguridad).
  firma-otp-expira-minutos: ${FIRMA_OTP_EXPIRA_MINUTOS:10}
  firma-otp-sesion-minutos: ${FIRMA_OTP_SESION_MINUTOS:30}
  firma-otp-max-intentos: ${FIRMA_OTP_MAX_INTENTOS:5}
  firma-otp-max-reenvios: ${FIRMA_OTP_MAX_REENVIOS:3}
  firma-otp-cooldown-segundos: ${FIRMA_OTP_COOLDOWN_SEGUNDOS:60}

# Ruta a LibreOffice Portable (soffice.exe)
libreoffice:
  path: ${user.home}/LibreOfficePortable/LibreOfficePortable/App/libreoffice/program/soffice.exe
