# =====================================================
# CONFIGURACION DE LA APLICACION
# =====================================================

server:
  port: 8001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/actas_glpi
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# JWT
security:
  jwt:
    secret: ${JWT_SECRET:YWMyN2U5ZjBkOGUxYjM0NTY3ODkwYWRlYmNmZ2hpamtsbW5vcHFy}
    expiration: ${JWT_EXPIRATION:86400000}

# Integracion GLPI
glpi:
  url: ${GLPI_URL:http://10.86.1.33/glpi/apirest.php}
  app-token: ${GLPI_APP_TOKEN:ZRsogtQqJgimxPwWxROo0F2WJdvLrsH0XLtcBKu8}
  user-token: ${GLPI_USER_TOKEN:sX4sG98XFSnNyVaLwDckHwpdxNgO6rxrOUsN1vht}

# Rutas de archivos
app:
  generated-dir: ${java.io.tmpdir}/actas_glpi_generados
  templates-dir: classpath:plantillas
